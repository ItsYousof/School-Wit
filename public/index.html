<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Container -->
  <div class="container">
    <!-- Landing/Login Screen -->
    <div id="landing-page" class="screen">
      <h1>Welcome to My Random Ahh Chat!</h1>
      <button onclick="showChat()">Enter Public Chat</button>
    </div>

    <!-- Public Chat Room -->
    <div id="chat-room" class="screen hidden">
      <header>
        <h2>Public Chat</h2>
      </header>
      <div id="messages-container"></div>
      <input type="text" id="message-input" placeholder="Type a message..." onkeydown="sendMessage(event)">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
